<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok・Claude AIプロンプト66選｜無料テンプレート集</title>
<meta name="description" content="GrokとClaudeをすぐ業務活用できるプロンプト66本を無料配布。営業メール・競合分析・SNS投稿など用途別に整理。コピーするだけで使えます。">
<meta property="og:title" content="Grok・Claude AIプロンプト66選｜無料テンプレート集">
<meta property="og:description" content="コピーするだけで使えるAIプロンプト66本を無料配布">
<meta property="og:url" content="https://jimmie01.github.io">
<meta property="og:type" content="website">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--card:#1a1a24;--border:#2a2a3a;--accent:#7c6ef5;--accent2:#f56e6e;--text:#e8e8f0;--muted:#888899}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,'Hiragino Sans',sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);padding:60px 20px 40px;text-align:center;border-bottom:1px solid var(--border)}
header h1{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;margin-bottom:12px}
header h1 span{color:var(--accent)}
header p{color:var(--muted);font-size:1.05rem;max-width:560px;margin:0 auto 24px}
.badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.8rem;font-weight:700;margin:4px;background:var(--accent);color:#fff}
.badge.red{background:var(--accent2)}
.tabs{display:flex;justify-content:center;gap:8px;padding:24px 16px 0;flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:8px 20px;border-radius:24px;cursor:pointer;font-size:.9rem;transition:all .2s}
.tab:hover,.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.search-bar{max-width:600px;margin:20px auto 0;padding:0 16px}
.search-bar input{width:100%;padding:12px 20px;border-radius:30px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:1rem;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:24px 16px 60px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;cursor:pointer;transition:transform .2s,border-color .2s;display:flex;flex-direction:column;gap:10px}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card.cg:hover{border-color:var(--accent2)}
.card-tag{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:rgba(124,110,245,.12);padding:2px 10px;border-radius:10px;width:fit-content}
.card.cg .card-tag{color:var(--accent2);background:rgba(245,110,110,.12)}
.card h3{font-size:.95rem;font-weight:700;line-height:1.4}
.card p{font-size:.82rem;color:var(--muted);line-height:1.5;flex:1}
.copy-btn{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:opacity .2s;width:100%;margin-top:4px}
.card.cg .copy-btn{background:var(--accent2)}
.copy-btn:hover{opacity:.85}
.copy-btn.copied{background:#2ecc71}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto}
.modal h2{font-size:1.1rem;margin-bottom:8px}
.modal .meta{font-size:.8rem;color:var(--muted);margin-bottom:16px}
.prompt-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;font-size:.85rem;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text);margin-bottom:16px}
.modal-btns{display:flex;gap:10px}
.modal-btns button{flex:1;padding:10px;border-radius:8px;border:none;font-size:.9rem;font-weight:600;cursor:pointer}
.btn-copy{background:var(--accent);color:#fff}
.btn-close{background:var(--surface);color:var(--text);border:1px solid var(--border)!important}
footer{text-align:center;padding:24px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
<h1>🎁 AI Bot <span>Gift Templates</span></h1>
<p>コピーするだけで使えるプロンプトテンプレート集。業務をすぐに自動化。</p>
<span class="badge">Grok Bot 56種</span>
<span class="badge red">Claude×Grok 10種</span>
</header>
<div class="tabs">
<button class="tab active" onclick="filterCat('all',this)">すべて</button>
<button class="tab" onclick="filterCat('grok',this)">Grok Bot</button>
<button class="tab" onclick="filterCat('cg',this)">Claude×Grok</button>
</div>
<div class="search-bar"><input type="text" id="si" placeholder="🔍 キーワードで検索..." oninput="filterSearch()"></div>
<div class="grid" id="grid"></div>
<div class="modal-overlay" id="mo" onclick="closeMO(event)">
<div class="modal">
<h2 id="mt"></h2><div class="meta" id="mm"></div>
<div class="prompt-box" id="mp"></div>
<div class="modal-btns">
<button class="btn-copy" onclick="copyP()">📋 プロンプトをコピー</button>
<button class="btn-close" onclick="closeDirect()">✕ 閉じる</button>
</div></div></div>
<footer><p>Powered by <a href="https://jimmie01.github.io">AI Conduit</a> · <a href="https://x.ai/grok">Grok</a> · <a href="https://claude.ai">Claude</a></p></footer>
<script src="templates.js"></script>
<script src="app.js"></script>
<div style="position:fixed;bottom:0;left:0;width:100%;background:linear-gradient(90deg,#7c6ef5,#f56e6e);padding:10px 20px;text-align:center;z-index:999;"><span style="color:#fff;font-size:.95rem;">💡 動画でAI活用術を毎日解説中 → </span><a href="https://www.youtube.com/@AI.Conduit?sub_confirmation=1" target="_blank" style="color:#fff;font-weight:800;text-decoration:underline;">チャンネル登録して見る ▶</a></div></body>
</html>
